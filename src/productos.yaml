intro: |
  Simbiosis nace de una búsqueda personal: alimentarme de forma más consciente
  sin renunciar al placer de la pastelería.

  Por eso elaboramos una pastelería noble, auténtica y fresca: plant-based, sin
  conservantes y con ingredientes de temporada. Disfrutar sabores deliciosos de
  manera consciente, equilibrada y natural.

  Te invito a recorrer el catálogo y descubrir cada propuesta. Si tenés dudas o
  querés una recomendación, estaré encantada de ayudarte.
