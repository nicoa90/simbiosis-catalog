productos:
  - nombre: Torta Telma
    categoria: Tortas
    descripcion: >
      Bizcocho de cacao, realizado con base de harina de almendras, cacao
      amargo,

      endulzado con fruta de estación en compota (pera, manzana) y dátiles.

      En su interior: cremoso de cacao perfumado con naranja, segundo piso con

      caramelo de dátiles y trocitos de nueces. Por fuera, cremoso de cacao amargo.
    presentaciones:
      - tamaño: Grande
        medida: 20 cm
        rinde: 16/20 porciones (aprox)
        precio: $99.000
      - tamaño: Mediano
        medida: 16 cm
        rinde: 12/16 porciones
        precio: $79.000
    recomendacion: >
      Conservar en caja o recipiente hermético, al resguardo del aire, para
      mantener su humedad. Retirar de heladera 10/15 minutos antes de su
      consumo.
    conservacion: |
      3/4 días en heladera.
      Hasta 6 meses en freezer.
    observaciones: SIN TACC (no apto celíacos). Consultar por diferentes sabores,
      rellenos y pisos.
